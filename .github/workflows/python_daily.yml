name: Daily Stock Check

on:
  push:
  workflow_dispatch:
  schedule:
    # 台灣時間 15:43 (UTC 7:43)
    - cron: '43 7 * * *'

env:
  # 解决 Node.js 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests selenium webdriver-manager yfinance lxml html5lib

      - name: Run Stock Bot
        run: python stock_bot.py

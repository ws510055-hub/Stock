name: CI
on: [push, workflow_dispatch]

env:
  # 解决警告的核心设置
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # 其他步骤...
name: Daily Stock Check

on:
  schedule:
    # 台灣時間 15:43 (UTC 7:43)
    - cron: '43 7 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 更新到 v4
      - name: Set up Python
        uses: actions/setup-python@v5  # 更新到 v5
        with:
          # 👇 這裡改成 3.10 (解決 yfinance 報錯的關鍵)
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 確保有安裝 yfinance
          pip install pandas requests selenium webdriver-manager yfinance lxml html5lib

      - name: Run Stock Bot
        run: python stock_bot.py
